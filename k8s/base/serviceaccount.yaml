# ServiceAccount used by both the API and the ingestion CronJob.
# Annotate with an IAM role ARN (IRSA) in your overlay or via the Helm chart
# so the pods can call Neptune / SSM / Secrets Manager without any static
# AWS credentials baked in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtg-deck-engine
  namespace: mtg-deck-engine
  annotations:
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/mtg-deck-engine
    description: |
      Add the eks.amazonaws.com/role-arn annotation in your overlay to enable IRSA.
