apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mtg-deck-engine-api
  namespace: mtg-deck-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mtg-deck-engine-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
