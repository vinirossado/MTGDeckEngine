# AWS Load Balancer Controller annotations — provisions an ALB and routes
# api.mtg.example.com → the Service. Replace the host and the ACM cert ARN.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtg-deck-engine-api
  namespace: mtg-deck-engine
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/REPLACE
spec:
  rules:
    - host: api.mtg.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mtg-deck-engine-api
                port:
                  number: 80
