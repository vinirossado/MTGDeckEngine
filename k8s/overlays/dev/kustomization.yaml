apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mtg-deck-engine
namePrefix: dev-
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: mtg-deck-engine-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: mtg-deck-engine-api
    patch: |
      - op: replace
        path: /spec/maxReplicas
        value: 2
