# Dev-only Shiro config: opens admin endpoints to the docker bridge network
# and to the host. DO NOT ship this to production — gate /$/** behind auth there.
[main]
ssl.enabled = false
plainMatcher = org.apache.shiro.web.filter.mgt.PathMatchingFilterChainResolver

[users]
admin = admin

[roles]
admin = *

[urls]
# Anonymous access for everything. The default config restricts /$/** to
# localhost, which breaks Docker port-forwarding because the source IP is the
# bridge gateway, not 127.0.0.1.
/**=anon
