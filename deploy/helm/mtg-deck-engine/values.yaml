image:
  repository: ghcr.io/vinirossado/mtg-deck-engine
  tag: "latest"
  pullPolicy: IfNotPresent

# ServiceAccount + IRSA. Provide the IAM role ARN for AWS workloads.
serviceAccount:
  create: true
  name: mtg-deck-engine
  irsaRoleArn: ""    # arn:aws:iam::123:role/mtg-deck-engine

replicas: 2

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 1000m, memory: 1Gi }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPU: 70
  targetMemory: 75

# Triplestore endpoint. For Neptune set both to https://CLUSTER:8182/sparql.
sparql:
  queryEndpoint:  "https://CLUSTER.REGION.neptune.amazonaws.com:8182/sparql"
  updateEndpoint: "https://CLUSTER.REGION.neptune.amazonaws.com:8182/sparql"
  useSigV4: false
  awsRegion: ""

ingestion:
  enableEdhTop16: true
  enableTopDeck:  true
  cronSchedule:   "0 3 * * *"

topdeck:
  formats: ["EDH", "Modern"]
  lookbackDays: 90
  minParticipants: 16

ai:
  enabled: false
  model:  "claude-sonnet-4-6"

# Pass via --set-string or sealed-secret. NEVER commit real values.
secrets:
  topdeckApiKey:    ""
  anthropicApiKey:  ""

# ALB Ingress. Disable when routing through the Istio mesh instead — the two
# are alternative entry points to the same Service, not layers.
ingress:
  enabled: true
  host: "api.mtg.example.com"
  certificateArn: ""

service:
  port: 80

# Istio mesh routing + blue/green. Off by default so the chart keeps rendering
# the plain ALB path for anyone not running a mesh; the values-blue.yaml /
# values-green.yaml files turn it on.
istio:
  enabled: false
  hosts: ["*"]
  gateway:
    selector:
      istio: ingressgateway
    port: 80
  # Namespace the VirtualService routes to. Empty means the release namespace;
  # set it to the other colour's namespace to flip live traffic.
  activeNamespace: ""
  # Service name to route to. Empty means this release's own name, which is
  # what you want when both colours are installed under the same release name.
  activeService: ""
