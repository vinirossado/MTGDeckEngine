{{- if .Values.istio.enabled -}}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ include "mtg.fullname" . }}
  labels: {{- include "mtg.labels" . | nindent 4 }}
spec:
  selector: {{- toYaml .Values.istio.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: {{ .Values.istio.gateway.port }}
        name: http
        protocol: HTTP
      hosts: {{- toYaml .Values.istio.hosts | nindent 8 }}
{{- end }}
