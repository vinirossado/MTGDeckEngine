apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mtg.fullname" . }}
  labels: {{- include "mtg.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "mtg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mtg.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: {{ include "mtg.fullname" . }} }
            {{- if or .Values.secrets.topdeckApiKey .Values.secrets.anthropicApiKey }}
            - secretRef:    { name: {{ include "mtg.fullname" . }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
