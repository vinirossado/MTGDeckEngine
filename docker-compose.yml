services:
  fuseki:
    build:
      context: ./docker/fuseki
    image: mtg/fuseki:5.1.0
    container_name: mtg-fuseki
    ports:
      - "3030:3030"
    environment:
      - JVM_ARGS=-Xmx2g
    # Default CMD in the Dockerfile creates a persistent TDB2 dataset at /mtg.
    # Override here only if you want a different dataset name or backend.
    volumes:
      - fuseki-data:/fuseki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3030/$$/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: src/MtgDeckEngine.Api/Dockerfile
    container_name: mtg-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Fuseki__QueryEndpoint=http://fuseki:3030/mtg/sparql
      - Fuseki__UpdateEndpoint=http://fuseki:3030/mtg/update
    depends_on:
      fuseki:
        condition: service_healthy

volumes:
  fuseki-data:
